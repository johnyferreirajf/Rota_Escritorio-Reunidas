<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#0b2239">
<title>Rota de Embarque • Grupo Reunidas</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
  }

  #map{
    position:fixed;
    top:0;
    right:0;
    bottom:0;
    left:0;
    width:100%;
    height:100%;
    z-index:1;
    background:#111;
  }

  .top{
    position:fixed;
    z-index:1000;
    left:10px;
    right:10px;
    top:10px;
    display:flex;
    gap:8px;
    pointer-events:none;
  }

  .card{
    pointer-events:auto;
    background:rgba(255,255,255,.96);
    border-radius:14px;
    padding:10px 12px;
    box-shadow:0 4px 18px rgba(0,0,0,.25);
  }

  .title-card{
    flex:1;
    min-width:0;
  }

  .title{
    font-weight:800;
    font-size:16px;
    color:#10263a;
  }

  .sub{
    margin-top:4px;
    color:#667480;
    font-size:11px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .metric{
    min-width:70px;
    text-align:center;
  }

  .metric b{
    display:block;
    font-size:15px;
    color:#10263a;
  }

  .metric span{
    font-size:10px;
    color:#667480;
  }

  .zoom-box{
    position:fixed;
    z-index:1000;
    right:12px;
    top:105px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .fab{
    width:48px;
    height:48px;
    border:0;
    border-radius:14px;
    background:white;
    box-shadow:0 4px 16px rgba(0,0,0,.25);
    font-size:25px;
    color:#10263a;
  }

  .bottom{
    position:fixed;
    z-index:1000;
    left:10px;
    right:10px;
    bottom:10px;
    background:rgba(255,255,255,.97);
    border-radius:18px;
    box-shadow:0 4px 20px rgba(0,0,0,.28);
    padding:12px;
  }

  .eyebrow{
    font-size:10px;
    font-weight:bold;
    letter-spacing:.08em;
    color:#1769aa;
  }

  .next{
    font-size:20px;
    font-weight:800;
    color:#10263a;
    margin-top:2px;
  }

  .nextmeta{
    font-size:11px;
    color:#667480;
    margin-top:3px;
  }

  .actions{
    margin-top:10px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
  }

  .btn{
    min-height:42px;
    border:1px solid #d8e0e6;
    border-radius:11px;
    background:#fff;
    color:#10263a;
    font-size:11px;
    font-weight:700;
  }

  .btn.primary{
    background:#1769aa;
    color:#fff;
    border-color:#1769aa;
  }

  .btn.green{
    background:#2f8f5b;
    color:#fff;
    border-color:#2f8f5b;
  }

  .gps-note{
    margin-top:8px;
    font-size:10px;
    line-height:1.3;
    color:#667480;
  }

  .leaflet-container{
    background:#111;
  }

  .leaflet-tile{
    max-width:none !important;
    max-height:none !important;
  }

  .driver-dot{
    width:20px;
    height:20px;
    border-radius:50%;
    background:#1677ff;
    border:4px solid #fff;
    box-shadow:0 0 0 5px rgba(22,119,255,.25);
  }

  .pin{
    width:30px;
    height:30px;
    border-radius:50%;
    border:3px solid #fff;
    background:#1769aa;
    color:#fff;
    display:grid;
    place-items:center;
    font-size:11px;
    font-weight:800;
    box-shadow:0 3px 10px rgba(0,0,0,.3);
  }

  .pin.start{background:#2f8f5b}
  .pin.end{background:#10263a}

  @media (min-width:700px){
    .bottom{width:410px;right:auto}
    .top{max-width:760px}
  }
</style>
</head>

<body>
<div id="map"></div>

<div class="top">
  <div class="card title-card">
    <div class="title">Rota de Embarque • Grupo Reunidas</div>
    <div class="sub" id="status">Calculando rota pelas ruas…</div>
  </div>
  <div class="card metric"><b id="km">—</b><span>distância</span></div>
  <div class="card metric"><b id="tempo">—</b><span>estimativa</span></div>
</div>

<div class="zoom-box">
  <button class="fab" id="zin">+</button>
  <button class="fab" id="zout">−</button>
  <button class="fab" id="center">⌖</button>
</div>

<div class="bottom">
  <div class="eyebrow">PRÓXIMA PARADA</div>
  <div class="next" id="nextName">Calculando…</div>
  <div class="nextmeta" id="nextMeta">Aguarde.</div>

  <div class="actions">
    <button class="btn primary" id="gps">Ativar GPS</button>
    <button class="btn" id="recalc">Recalcular</button>
    <button class="btn" id="maps">Google Maps</button>
    <button class="btn green" id="picked">Embarcou</button>
  </div>

  <div class="gps-note" id="gpsNote">
    O mapa usa fundo Google Híbrido. Para GPS em tempo real, abra este HTML por um endereço HTTPS.
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const startFixed = {name:"Motorista",lat:-17.997716,lon:-49.363442};

const people = [
  {id:"igor",name:"Igor",lat:-18.0093055556,lon:-49.3623333333},
  {id:"telcio",name:"Télcio",lat:-18.015975,lon:-49.372719},
  {id:"david",name:"David",lat:-18.0114722222,lon:-49.3354722222},
  {id:"paulo",name:"Paulo",lat:-18.036596,lon:-49.374805},
  {id:"natan",name:"Natan",lat:-18.0340000000,lon:-49.3700833333}
];

const destination = {name:"Grupo Reunidas",lat:-17.964560,lon:-50.008964};

let done = new Set(JSON.parse(localStorage.getItem("reunidas_done_simple") || "[]"));
let currentPosition = null;
let ordered = [];
let routeLine = null;
let routeOutline = null;
let driverMarker = null;
let watchId = null;
let routeDistance = null;
let routeDuration = null;

const map = L.map("map",{
  zoomControl:false,
  attributionControl:true,
  touchZoom:true,
  dragging:true,
  doubleClickZoom:true,
  scrollWheelZoom:true,
  zoomAnimation:false,
  fadeAnimation:false,
  markerZoomAnimation:false
}).setView([-18.01,-49.46],11);

/*
  Google Hybrid por um único host.
  Usar um host único evita o problema que alguns navegadores Android apresentam
  quando alternam mt0/mt1/mt2/mt3 em arquivos locais/content://.
*/
const googleHybrid = L.tileLayer(
  "https://mt1.google.com/vt/lyrs=y&hl=pt-BR&x={x}&y={y}&z={z}",
  {
    minZoom:2,
    maxZoom:21,
    tileSize:256,
    zoomOffset:0,
    detectRetina:false,
    updateWhenIdle:true,
    updateWhenZooming:false,
    keepBuffer:4,
    crossOrigin:false,
    attribution:"Google"
  }
).addTo(map);

googleHybrid.on("tileerror", function(e){
  console.warn("Falha ao carregar tile Google", e.coords);
});

function icon(label,cls=""){
  return L.divIcon({
    className:"",
    html:`<div class="pin ${cls}">${label}</div>`,
    iconSize:[30,30],
    iconAnchor:[15,15]
  });
}

L.marker([startFixed.lat,startFixed.lon],{icon:icon("S","start")})
  .addTo(map).bindPopup("<b>Motorista</b><br>Ponto inicial");

people.forEach((p,i)=>{
  L.marker([p.lat,p.lon],{icon:icon(String(i+1))})
    .addTo(map).bindPopup(`<b>${p.name}</b>`);
});

L.marker([destination.lat,destination.lon],{icon:icon("F","end")})
  .addTo(map).bindPopup("<b>Grupo Reunidas</b><br>Destino final");

const $ = id => document.getElementById(id);

function fmtKm(m){
  if(m==null) return "—";
  return m<1000 ? Math.round(m)+" m" : (m/1000).toFixed(1)+" km";
}

function fmtTime(s){
  if(s==null) return "—";
  const min=Math.round(s/60);
  if(min<60) return min+" min";
  return Math.floor(min/60)+"h "+(min%60)+"min";
}

function remaining(){
  return people.filter(p=>!done.has(p.id));
}

function startPoint(){
  return currentPosition || startFixed;
}

async function optimize(fit=true){
  const rem=remaining();
  const start=startPoint();

  $("status").textContent="Calculando rota pelas ruas…";

  if(rem.length===0){
    ordered=[];
    await direct(start,fit);
    render();
    return;
  }

  const pts=[start,...rem,destination];
  const coords=pts.map(p=>`${p.lon},${p.lat}`).join(";");

  try{
    const res=await fetch(`https://router.project-osrm.org/trip/v1/driving/${coords}?source=first&destination=last&roundtrip=false&overview=full&geometries=geojson`);
    const data=await res.json();

    if(data.code!=="Ok" || !data.trips?.length) throw new Error("route");

    const wp=data.waypoints;
    ordered=rem
      .map((p,i)=>({...p,order:wp[i+1].waypoint_index}))
      .sort((a,b)=>a.order-b.order);

    const trip=data.trips[0];
    routeDistance=trip.distance;
    routeDuration=trip.duration;

    drawGeoJSON(trip.geometry,fit);
    $("status").textContent=currentPosition
      ? "Rota otimizada a partir da sua posição atual"
      : "Rota otimizada a partir do motorista";
  }catch(e){
    console.error(e);
    ordered=rem;
    drawSimple([start,...rem,destination],fit);
    routeDistance=null;
    routeDuration=null;
    $("status").textContent="Rota aproximada • serviço de rotas indisponível";
  }

  render();
}

async function direct(start,fit){
  const coords=`${start.lon},${start.lat};${destination.lon},${destination.lat}`;
  try{
    const res=await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
    const data=await res.json();
    const r=data.routes[0];
    routeDistance=r.distance;
    routeDuration=r.duration;
    drawGeoJSON(r.geometry,fit);
    $("status").textContent="Todos embarcaram • seguindo ao Grupo Reunidas";
  }catch(e){
    drawSimple([start,destination],fit);
  }
}

function clearRoute(){
  if(routeLine) map.removeLayer(routeLine);
  if(routeOutline) map.removeLayer(routeOutline);
}

function drawGeoJSON(geo,fit){
  clearRoute();

  const latlngs=geo.coordinates.map(c=>[c[1],c[0]]);

  routeOutline=L.polyline(latlngs,{
    weight:9,
    color:"#ffffff",
    opacity:.75,
    lineCap:"round",
    lineJoin:"round"
  }).addTo(map);

  routeLine=L.polyline(latlngs,{
    weight:5,
    color:"#1769aa",
    opacity:1,
    lineCap:"round",
    lineJoin:"round"
  }).addTo(map);

  if(fit){
    map.fitBounds(routeLine.getBounds(),{
      paddingTopLeft:[20,100],
      paddingBottomRight:[20,180]
    });
  }
}

function drawSimple(points,fit){
  clearRoute();
  const latlngs=points.map(p=>[p.lat,p.lon]);

  routeOutline=L.polyline(latlngs,{weight:8,color:"#fff",opacity:.7}).addTo(map);
  routeLine=L.polyline(latlngs,{weight:4,color:"#d58b00",dashArray:"8 8"}).addTo(map);

  if(fit){
    map.fitBounds(routeLine.getBounds(),{
      paddingTopLeft:[20,100],
      paddingBottomRight:[20,180]
    });
  }
}

function render(){
  $("km").textContent=fmtKm(routeDistance);
  $("tempo").textContent=fmtTime(routeDuration);

  if(ordered.length){
    $("nextName").textContent=ordered[0].name;
    $("nextMeta").textContent=currentPosition
      ? "Rota atualizada pela posição do motorista."
      : "Ative o GPS para acompanhar o veículo.";
    $("picked").disabled=false;
  }else{
    $("nextName").textContent="Grupo Reunidas";
    $("nextMeta").textContent="Todos os passageiros embarcaram.";
    $("picked").disabled=true;
  }
}

function activateGPS(){
  if(!window.isSecureContext || location.protocol==="content:" || location.protocol==="file:"){
    $("gpsNote").textContent="GPS bloqueado porque o arquivo foi aberto diretamente do WhatsApp. Hospede o HTML em HTTPS e abra pelo link.";
    $("gps").textContent="GPS requer HTTPS";
    return;
  }

  if(!navigator.geolocation){
    $("gpsNote").textContent="Este navegador não oferece geolocalização.";
    return;
  }

  if(watchId!==null) navigator.geolocation.clearWatch(watchId);

  watchId=navigator.geolocation.watchPosition(
    pos=>{
      currentPosition={lat:pos.coords.latitude,lon:pos.coords.longitude};

      if(!driverMarker){
        driverMarker=L.marker([currentPosition.lat,currentPosition.lon],{
          icon:L.divIcon({
            className:"",
            html:'<div class="driver-dot"></div>',
            iconSize:[28,28],
            iconAnchor:[14,14]
          }),
          zIndexOffset:2000
        }).addTo(map);
      }else{
        driverMarker.setLatLng([currentPosition.lat,currentPosition.lon]);
      }

      $("gps").textContent="GPS ativo";
      $("gpsNote").textContent=`Localização ativa • precisão aproximada ${Math.round(pos.coords.accuracy)} m`;

      optimize(false);
    },
    err=>{
      $("gpsNote").textContent="Não foi possível acessar a localização. Verifique a permissão do navegador.";
    },
    {
      enableHighAccuracy:true,
      maximumAge:5000,
      timeout:15000
    }
  );
}

$("zin").onclick=()=>map.zoomIn();
$("zout").onclick=()=>map.zoomOut();

$("center").onclick=()=>{
  if(currentPosition){
    map.setView([currentPosition.lat,currentPosition.lon],17);
  }else{
    map.setView([startFixed.lat,startFixed.lon],16);
  }
};

$("gps").onclick=activateGPS;
$("recalc").onclick=()=>optimize(false);

$("picked").onclick=async()=>{
  if(!ordered.length) return;
  done.add(ordered[0].id);
  localStorage.setItem("reunidas_done_simple",JSON.stringify([...done]));
  await optimize(false);
};

$("maps").onclick=()=>{
  const s=startPoint();
  const mids=ordered.length ? ordered : remaining();
  let url=`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(s.lat+","+s.lon)}&destination=${encodeURIComponent(destination.lat+","+destination.lon)}&travelmode=driving`;
  if(mids.length){
    url+=`&waypoints=${encodeURIComponent(mids.map(p=>p.lat+","+p.lon).join("|"))}`;
  }
  window.open(url,"_blank");
};

function fixSize(){
  setTimeout(()=>{
    map.invalidateSize(false);
    googleHybrid.redraw();
  },150);
}

window.addEventListener("load",()=>{
  fixSize();
  setTimeout(fixSize,700);
  setTimeout(fixSize,1500);
});

window.addEventListener("resize",fixSize);
window.addEventListener("orientationchange",()=>setTimeout(fixSize,400));
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden) fixSize();
});

optimize(true);
</script>
</body>
</html>

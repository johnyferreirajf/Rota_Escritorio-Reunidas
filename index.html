<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#0b2239">
<title>Rota de Embarque • Grupo Reunidas</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body{
  margin:0;padding:0;width:100%;height:100%;
  overflow:hidden;background:#111;
  font-family:Arial,Helvetica,sans-serif
}
#map{
  position:fixed;inset:0;width:100%;height:100%;
  z-index:1;background:#111
}
.leaflet-container{background:#111}
.leaflet-tile{max-width:none!important;max-height:none!important}

.top{
  position:fixed;z-index:1000;
  top:10px;left:10px;right:10px;
  display:flex;gap:8px;pointer-events:none
}
.card{
  pointer-events:auto;background:rgba(255,255,255,.96);
  border-radius:14px;padding:10px 12px;
  box-shadow:0 4px 18px rgba(0,0,0,.25)
}
.title-card{flex:1;min-width:0}
.title{font-size:15px;font-weight:800;color:#10263a}
.sub{
  margin-top:4px;font-size:11px;color:#667480;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.metric{min-width:67px;text-align:center}
.metric b{display:block;font-size:14px;color:#10263a}
.metric span{font-size:10px;color:#667480}

.tools{
  position:fixed;z-index:1000;
  right:12px;top:105px;
  display:flex;flex-direction:column;gap:8px
}
.fab{
  width:48px;height:48px;border:0;border-radius:14px;
  background:#fff;color:#10263a;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
  font-size:24px;font-weight:bold
}

.bottom{
  position:fixed;z-index:1000;
  left:10px;right:10px;bottom:10px;
  background:rgba(255,255,255,.97);
  border-radius:18px;padding:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.28)
}

.mode{
  display:grid;grid-template-columns:1fr 1fr;
  gap:7px;margin-bottom:10px
}
.mode button{
  border:1px solid #ccd7df;background:#eef3f6;color:#29455c;
  border-radius:11px;min-height:39px;font-weight:800;font-size:12px
}
.mode button.active{
  background:#102f4d;color:#fff;border-color:#102f4d
}

.eyebrow{
  font-size:10px;font-weight:bold;letter-spacing:.08em;color:#1769aa
}
.next{
  font-size:20px;font-weight:800;color:#10263a;margin-top:2px
}
.nextmeta{font-size:11px;color:#667480;margin-top:3px}

.actions{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:7px;margin-top:10px
}
.btn{
  min-height:42px;border:1px solid #d8e0e6;border-radius:11px;
  background:#fff;color:#10263a;font-size:11px;font-weight:700
}
.btn.primary{background:#1769aa;color:#fff;border-color:#1769aa}
.btn.green{background:#2f8f5b;color:#fff;border-color:#2f8f5b}
.btn.orange{background:#c87900;color:#fff;border-color:#c87900}
.btn:disabled{opacity:.5}

.progress{
  margin-top:9px;font-size:10px;color:#667480;
  display:flex;justify-content:space-between;gap:10px
}
.gps-note{
  margin-top:6px;font-size:10px;line-height:1.3;color:#667480
}

.driver-dot{
  width:20px;height:20px;border-radius:50%;
  background:#1677ff;border:4px solid #fff;
  box-shadow:0 0 0 5px rgba(22,119,255,.25)
}
.pin{
  width:32px;height:32px;border-radius:50%;
  border:3px solid #fff;background:#1769aa;color:#fff;
  display:grid;place-items:center;
  font-size:11px;font-weight:800;
  box-shadow:0 3px 10px rgba(0,0,0,.35)
}
.pin.start{background:#2f8f5b}
.pin.end{background:#10263a}
.pin.done{background:#7e8d97}

@media(max-width:600px){
  .metric{display:none}
}
@media(min-width:700px){
  .bottom{width:430px;right:auto}
  .top{max-width:760px}
}
</style>
</head>

<body>
<div id="map"></div>

<div class="top">
  <div class="card title-card">
    <div class="title">Rota • Grupo Reunidas</div>
    <div class="sub" id="status">Calculando melhor sequência pelas ruas…</div>
  </div>
  <div class="card metric"><b id="km">—</b><span>distância</span></div>
  <div class="card metric"><b id="tempo">—</b><span>estimativa</span></div>
</div>

<div class="tools">
  <button class="fab" id="zin" aria-label="Aumentar zoom">+</button>
  <button class="fab" id="zout" aria-label="Diminuir zoom">−</button>
  <button class="fab" id="center" aria-label="Centralizar">⌖</button>
  <button class="fab" id="fit" aria-label="Ver rota inteira">⤢</button>
</div>

<div class="bottom">
  <div class="mode">
    <button id="modeIda" class="active">IDA → Escritório</button>
    <button id="modeVolta">VOLTA → Casas</button>
  </div>

  <div class="eyebrow" id="nextLabel">PRÓXIMO EMBARQUE</div>
  <div class="next" id="nextName">Calculando…</div>
  <div class="nextmeta" id="nextMeta">Aguarde.</div>

  <div class="actions">
    <button class="btn primary" id="gps">Ativar GPS</button>
    <button class="btn" id="recalc">Recalcular</button>
    <button class="btn" id="maps">Google Maps</button>
    <button class="btn green" id="served">Embarcou</button>
  </div>

  <div class="progress">
    <span id="progressText">0 de 6 concluídos</span>
    <span id="modeText">Modo: ida</span>
  </div>

  <div class="gps-note" id="gpsNote">
    Para GPS em tempo real, abra esta página por um endereço HTTPS.
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DRIVER = {
  id:"motorista",name:"Motorista",
  lat:-17.997716,lon:-49.363442
};

const OFFICE = {
  id:"reunidas",name:"Grupo Reunidas",
  lat:-17.964560,lon:-50.008964
};

const PEOPLE = [
  {id:"igor",name:"Igor",
   lat:-18.0093055556,lon:-49.3623333333},

  {id:"telcio",name:"Télcio",
   lat:-18.015975,lon:-49.372719},

  {id:"david",name:"David",
   lat:-18.0114722222,lon:-49.3354722222},

  {id:"paulo",name:"Paulo",
   lat:-18.036596,lon:-49.374805},

  {id:"natan",name:"Natan",
   lat:-18.0340000000,lon:-49.3700833333},

  /* 18°00'06.6"S 49°21'49.2"W */
  {id:"patricia",name:"Patrícia",
   lat:-18.0018333333,lon:-49.3636666667}
];

let mode = localStorage.getItem("reunidas_mode") || "ida";
let idaDone = new Set(JSON.parse(localStorage.getItem("reunidas_ida_done") || "[]"));
let voltaDone = new Set(JSON.parse(localStorage.getItem("reunidas_volta_done") || "[]"));

let currentPosition = null;
let ordered = [];
let routeLine = null;
let routeOutline = null;
let driverMarker = null;
let accuracyCircle = null;
let passengerMarkers = [];
let endpointMarkers = [];
let watchId = null;
let routeDistance = null;
let routeDuration = null;
let routing = false;

const $ = id => document.getElementById(id);

const map = L.map("map",{
  zoomControl:false,
  attributionControl:true,
  touchZoom:true,
  dragging:true,
  doubleClickZoom:true,
  scrollWheelZoom:true,
  zoomAnimation:false,
  fadeAnimation:false,
  markerZoomAnimation:false
}).setView([-18.01,-49.46],11);

/* Google Híbrido: satélite + nomes de ruas/rodovias */
const googleHybrid = L.tileLayer(
  "https://mt1.google.com/vt/lyrs=y&hl=pt-BR&x={x}&y={y}&z={z}",
  {
    minZoom:2,maxZoom:21,tileSize:256,zoomOffset:0,
    detectRetina:false,updateWhenIdle:true,
    updateWhenZooming:false,keepBuffer:5,
    attribution:"Google"
  }
).addTo(map);

function activeDone(){
  return mode==="ida" ? idaDone : voltaDone;
}

function saveState(){
  localStorage.setItem("reunidas_mode",mode);
  localStorage.setItem("reunidas_ida_done",JSON.stringify([...idaDone]));
  localStorage.setItem("reunidas_volta_done",JSON.stringify([...voltaDone]));
}

function endpointStart(){
  if(currentPosition) return currentPosition;
  return mode==="ida" ? DRIVER : OFFICE;
}

function endpointEnd(){
  return mode==="ida" ? OFFICE : DRIVER;
}

function remaining(){
  const done=activeDone();
  return PEOPLE.filter(p=>!done.has(p.id));
}

function fmtKm(m){
  if(m==null) return "—";
  return m<1000 ? Math.round(m)+" m" : (m/1000).toFixed(1)+" km";
}

function fmtTime(s){
  if(s==null) return "—";
  const min=Math.max(1,Math.round(s/60));
  if(min<60) return min+" min";
  return Math.floor(min/60)+"h "+(min%60)+"min";
}

function pinIcon(label,cls=""){
  return L.divIcon({
    className:"",
    html:`<div class="pin ${cls}">${label}</div>`,
    iconSize:[32,32],iconAnchor:[16,16]
  });
}

function clearMarkers(){
  passengerMarkers.forEach(m=>map.removeLayer(m));
  endpointMarkers.forEach(m=>map.removeLayer(m));
  passengerMarkers=[];
  endpointMarkers=[];
}

function rebuildMarkers(){
  clearMarkers();

  const start = mode==="ida" ? DRIVER : OFFICE;
  const end   = mode==="ida" ? OFFICE : DRIVER;

  endpointMarkers.push(
    L.marker([start.lat,start.lon],{icon:pinIcon("S","start")})
     .addTo(map)
     .bindPopup(`<b>Início da ${mode}</b><br>${start.name}`)
  );

  endpointMarkers.push(
    L.marker([end.lat,end.lon],{icon:pinIcon("F","end")})
     .addTo(map)
     .bindPopup(`<b>Final da ${mode}</b><br>${end.name}`)
  );

  const done=activeDone();

  PEOPLE.forEach(p=>{
    const idx=ordered.findIndex(x=>x.id===p.id);
    const isDone=done.has(p.id);

    let label="•";
    if(isDone){
      label="✓";
    }else if(idx>=0){
      /* A numeração agora segue EXATAMENTE a ordem otimizada da rota */
      label=String(idx+1);
    }

    passengerMarkers.push(
      L.marker([p.lat,p.lon],{
        icon:pinIcon(label,isDone?"done":"")
      })
      .addTo(map)
      .bindPopup(
        `<b>${p.name}</b><br>`+
        (isDone
          ? (mode==="ida" ? "Embarque concluído" : "Desembarque concluído")
          : (idx>=0 ? `Parada ${idx+1}` : "Aguardando rota"))
      )
    );
  });
}

async function optimize(fit=true){
  if(routing) return;
  routing=true;

  const rem=remaining();
  const start=endpointStart();
  const end=endpointEnd();

  $("status").textContent="Calculando melhor sequência pelas ruas…";
  $("recalc").disabled=true;

  if(rem.length===0){
    ordered=[];
    await routeDirect(start,end,fit);
    routing=false;
    $("recalc").disabled=false;
    rebuildMarkers();
    render();
    return;
  }

  const pts=[start,...rem,end];
  const coords=pts.map(p=>`${p.lon},${p.lat}`).join(";");

  try{
    const res=await fetch(
      `https://router.project-osrm.org/trip/v1/driving/${coords}`+
      `?source=first&destination=last&roundtrip=false&overview=full&geometries=geojson`
    );
    const data=await res.json();

    if(data.code!=="Ok" || !data.trips?.length) throw new Error("route");

    const wp=data.waypoints;

    ordered=rem
      .map((p,i)=>({...p,routeIndex:wp[i+1].waypoint_index}))
      .sort((a,b)=>a.routeIndex-b.routeIndex);

    const trip=data.trips[0];
    routeDistance=trip.distance;
    routeDuration=trip.duration;

    drawGeoJSON(trip.geometry,fit);

    $("status").textContent=
      mode==="ida"
      ? "IDA • sequência otimizada até o Grupo Reunidas"
      : "VOLTA • sequência otimizada para deixar os passageiros";
  }catch(e){
    console.error(e);

    /* fallback: proximidade simples; a ordem será recalculada pelo OSRM quando voltar */
    ordered=nearestNeighbor(start,rem,end);
    routeDistance=null;
    routeDuration=null;

    drawSimple([start,...ordered,end],fit);
    $("status").textContent="Rota aproximada • serviço de rotas indisponível";
  }

  routing=false;
  $("recalc").disabled=false;
  rebuildMarkers();
  render();
}

function hav(a,b){
  const R=6371000, rad=Math.PI/180;
  const p1=a.lat*rad,p2=b.lat*rad;
  const dp=(b.lat-a.lat)*rad;
  const dl=(b.lon-a.lon)*rad;
  const h=Math.sin(dp/2)**2+
          Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function nearestNeighbor(start,items,end){
  let here=start;
  let left=[...items];
  let result=[];

  while(left.length){
    left.sort((a,b)=>hav(here,a)-hav(here,b));
    const next=left.shift();
    result.push(next);
    here=next;
  }
  return result;
}

async function routeDirect(start,end,fit){
  try{
    const coords=`${start.lon},${start.lat};${end.lon},${end.lat}`;
    const res=await fetch(
      `https://router.project-osrm.org/route/v1/driving/${coords}`+
      `?overview=full&geometries=geojson`
    );
    const data=await res.json();

    if(data.code!=="Ok" || !data.routes?.length) throw new Error("route");

    const r=data.routes[0];
    routeDistance=r.distance;
    routeDuration=r.duration;
    drawGeoJSON(r.geometry,fit);

    $("status").textContent=
      mode==="ida"
      ? "Todos embarcaram • seguindo para o Grupo Reunidas"
      : "Todos desembarcaram • seguindo para o ponto do motorista";
  }catch(e){
    routeDistance=null;
    routeDuration=null;
    drawSimple([start,end],fit);
  }
}

function clearRoute(){
  if(routeLine) map.removeLayer(routeLine);
  if(routeOutline) map.removeLayer(routeOutline);
}

function drawGeoJSON(geo,fit){
  clearRoute();
  const latlngs=geo.coordinates.map(c=>[c[1],c[0]]);

  routeOutline=L.polyline(latlngs,{
    weight:9,color:"#fff",opacity:.82,
    lineCap:"round",lineJoin:"round"
  }).addTo(map);

  routeLine=L.polyline(latlngs,{
    weight:5,color:"#1769aa",opacity:1,
    lineCap:"round",lineJoin:"round"
  }).addTo(map);

  if(fit) fitRoute();
}

function drawSimple(points,fit){
  clearRoute();
  const latlngs=points.map(p=>[p.lat,p.lon]);

  routeOutline=L.polyline(latlngs,{
    weight:8,color:"#fff",opacity:.75
  }).addTo(map);

  routeLine=L.polyline(latlngs,{
    weight:4,color:"#c87900",dashArray:"8 8"
  }).addTo(map);

  if(fit) fitRoute();
}

function fitRoute(){
  if(routeLine && routeLine.getBounds().isValid()){
    map.fitBounds(routeLine.getBounds(),{
      paddingTopLeft:[20,105],
      paddingBottomRight:[20,195]
    });
  }
}

function render(){
  $("km").textContent=fmtKm(routeDistance);
  $("tempo").textContent=fmtTime(routeDuration);

  $("modeIda").classList.toggle("active",mode==="ida");
  $("modeVolta").classList.toggle("active",mode==="volta");

  $("modeText").textContent="Modo: "+mode;
  $("nextLabel").textContent=
    mode==="ida" ? "PRÓXIMO EMBARQUE" : "PRÓXIMO DESEMBARQUE";

  $("served").textContent=
    mode==="ida" ? "Embarcou" : "Desembarcou";

  $("served").className=
    "btn "+(mode==="ida" ? "green" : "orange");

  const done=activeDone();
  $("progressText").textContent=
    `${done.size} de ${PEOPLE.length} concluídos`;

  if(ordered.length){
    $("nextName").textContent=ordered[0].name;
    $("nextMeta").textContent=
      currentPosition
      ? "Rota calculada a partir da posição atual do motorista."
      : `Parada nº 1 da ${mode}.`;
    $("served").disabled=false;
  }else{
    $("nextName").textContent=
      mode==="ida" ? "Grupo Reunidas" : "Motorista";
    $("nextMeta").textContent=
      mode==="ida"
      ? "Todos os passageiros embarcaram."
      : "Todos os passageiros desembarcaram.";
    $("served").disabled=true;
  }
}

function activateGPS(){
  if(!window.isSecureContext ||
     location.protocol==="content:" ||
     location.protocol==="file:"){

    $("gpsNote").textContent=
      "GPS bloqueado: abra o mapa pelo endereço HTTPS do GitHub Pages.";
    $("gps").textContent="GPS requer HTTPS";
    return;
  }

  if(!navigator.geolocation){
    $("gpsNote").textContent="Geolocalização indisponível neste navegador.";
    return;
  }

  if(watchId!==null){
    navigator.geolocation.clearWatch(watchId);
  }

  $("gpsNote").textContent="Buscando sua localização…";

  watchId=navigator.geolocation.watchPosition(
    pos=>{
      currentPosition={
        lat:pos.coords.latitude,
        lon:pos.coords.longitude
      };

      const ll=[currentPosition.lat,currentPosition.lon];

      if(!driverMarker){
        driverMarker=L.marker(ll,{
          icon:L.divIcon({
            className:"",
            html:'<div class="driver-dot"></div>',
            iconSize:[28,28],
            iconAnchor:[14,14]
          }),
          zIndexOffset:3000
        }).addTo(map).bindPopup("<b>Localização atual do motorista</b>");

        accuracyCircle=L.circle(ll,{
          radius:pos.coords.accuracy||15,
          weight:1,opacity:.4,fillOpacity:.08,
          color:"#1677ff"
        }).addTo(map);
      }else{
        driverMarker.setLatLng(ll);
        accuracyCircle
          .setLatLng(ll)
          .setRadius(pos.coords.accuracy||15);
      }

      $("gps").textContent="GPS ativo";
      $("gpsNote").textContent=
        `Localização ativa • precisão aproximada ${Math.round(pos.coords.accuracy)} m`;
    },
    err=>{
      let msg="Não foi possível acessar a localização.";
      if(err.code===1) msg="Permissão de localização negada no navegador.";
      if(err.code===2) msg="O celular não conseguiu determinar a posição.";
      if(err.code===3) msg="Tempo esgotado ao obter a localização.";
      $("gpsNote").textContent=msg;
    },
    {
      enableHighAccuracy:true,
      maximumAge:3000,
      timeout:15000
    }
  );
}

async function setMode(newMode){
  mode=newMode;
  currentPosition=null;
  saveState();

  /* remove apenas a indicação de GPS da rota anterior;
     o GPS pode ser reativado pelo botão se desejado */
  if(driverMarker){
    map.removeLayer(driverMarker);
    driverMarker=null;
  }
  if(accuracyCircle){
    map.removeLayer(accuracyCircle);
    accuracyCircle=null;
  }

  ordered=[];
  rebuildMarkers();
  render();
  await optimize(true);
}

$("modeIda").onclick=()=>setMode("ida");
$("modeVolta").onclick=()=>setMode("volta");

$("zin").onclick=()=>map.zoomIn();
$("zout").onclick=()=>map.zoomOut();

$("center").onclick=()=>{
  if(currentPosition){
    map.setView([currentPosition.lat,currentPosition.lon],17);
  }else{
    const s=mode==="ida" ? DRIVER : OFFICE;
    map.setView([s.lat,s.lon],16);
  }
};

$("fit").onclick=fitRoute;
$("gps").onclick=activateGPS;
$("recalc").onclick=()=>optimize(false);

$("served").onclick=async()=>{
  if(!ordered.length) return;

  const p=ordered[0];
  activeDone().add(p.id);
  saveState();

  await optimize(false);
};

$("maps").onclick=()=>{
  const s=endpointStart();
  const e=endpointEnd();
  const mids=ordered.length ? ordered : remaining();

  let url=
    `https://www.google.com/maps/dir/?api=1`+
    `&origin=${encodeURIComponent(s.lat+","+s.lon)}`+
    `&destination=${encodeURIComponent(e.lat+","+e.lon)}`+
    `&travelmode=driving`;

  if(mids.length){
    url+=`&waypoints=${encodeURIComponent(
      mids.map(p=>p.lat+","+p.lon).join("|")
    )}`;
  }

  window.open(url,"_blank");
};

/* Duplo toque/clique no título reinicia apenas o modo atual */
document.querySelector(".title-card").ondblclick=async()=>{
  if(confirm(
    mode==="ida"
    ? "Reiniciar todos os embarques da ida?"
    : "Reiniciar todos os desembarques da volta?"
  )){
    activeDone().clear();
    saveState();
    await optimize(true);
  }
};

function fixSize(){
  setTimeout(()=>{
    map.invalidateSize(false);
    try{googleHybrid.redraw()}catch(e){}
  },150);
}

window.addEventListener("load",()=>{
  fixSize();
  setTimeout(fixSize,700);
  setTimeout(fixSize,1500);
});

window.addEventListener("resize",fixSize);
window.addEventListener("orientationchange",()=>setTimeout(fixSize,400));

document.addEventListener("visibilitychange",()=>{
  if(!document.hidden) fixSize();
});

rebuildMarkers();
render();
optimize(true);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#0b2239">
<title>Rota Grupo Reunidas</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body{
  margin:0;padding:0;width:100%;height:100%;
  overflow:hidden;background:#111;
  font-family:Arial,Helvetica,sans-serif
}
#map{
  position:fixed;inset:0;width:100%;height:100%;
  z-index:1;background:#111
}
.leaflet-container{background:#111}
.leaflet-tile{max-width:none!important;max-height:none!important}

.top{
  position:fixed;z-index:1000;
  top:10px;left:10px;right:10px;
  display:flex;gap:8px;pointer-events:none
}
.card{
  pointer-events:auto;background:rgba(255,255,255,.96);
  border-radius:14px;padding:10px 12px;
  box-shadow:0 4px 18px rgba(0,0,0,.25)
}
.title-card{flex:1;min-width:0}
.title{font-size:15px;font-weight:800;color:#10263a}
.sub{
  margin-top:4px;font-size:11px;color:#667480;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.metric{min-width:67px;text-align:center}
.metric b{display:block;font-size:14px;color:#10263a}
.metric span{font-size:10px;color:#667480}

.tools{
  position:fixed;z-index:1000;
  right:12px;top:105px;
  display:flex;flex-direction:column;gap:8px
}
.fab{
  width:48px;height:48px;border:0;border-radius:14px;
  background:#fff;color:#10263a;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
  font-size:24px;font-weight:bold
}

.bottom{
  position:fixed;z-index:1000;
  left:10px;right:10px;bottom:10px;
  background:rgba(255,255,255,.97);
  border-radius:18px;padding:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.28)
}

.mode{
  display:grid;grid-template-columns:1fr 1fr;
  gap:7px;margin-bottom:9px
}
.mode button{
  border:1px solid #ccd7df;background:#eef3f6;color:#29455c;
  border-radius:11px;min-height:39px;font-weight:800;font-size:12px
}
.mode button.active{
  background:#102f4d;color:#fff;border-color:#102f4d
}

.route-seq{
  margin-bottom:8px;padding:7px 9px;
  border-radius:10px;background:#eef4f8;
  font-size:10px;line-height:1.35;color:#395369;
  white-space:nowrap;overflow-x:auto
}
.route-seq b{color:#10263a}

.eyebrow{
  font-size:10px;font-weight:bold;letter-spacing:.08em;color:#1769aa
}
.next{
  font-size:20px;font-weight:800;color:#10263a;margin-top:2px
}
.nextmeta{font-size:11px;color:#667480;margin-top:3px}

.actions{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:7px;margin-top:10px
}
.btn{
  min-height:42px;border:1px solid #d8e0e6;border-radius:11px;
  background:#fff;color:#10263a;font-size:11px;font-weight:700
}
.btn.primary{background:#1769aa;color:#fff;border-color:#1769aa}
.btn.green{background:#2f8f5b;color:#fff;border-color:#2f8f5b}
.btn.orange{background:#c87900;color:#fff;border-color:#c87900}
.btn:disabled{opacity:.5}

.progress{
  margin-top:8px;font-size:10px;color:#667480;
  display:flex;justify-content:space-between;gap:10px
}
.gps-note{
  margin-top:5px;font-size:10px;line-height:1.3;color:#667480
}

.driver-dot{
  width:20px;height:20px;border-radius:50%;
  background:#1677ff;border:4px solid #fff;
  box-shadow:0 0 0 5px rgba(22,119,255,.25)
}
.pin{
  width:32px;height:32px;border-radius:50%;
  border:3px solid #fff;background:#1769aa;color:#fff;
  display:grid;place-items:center;
  font-size:11px;font-weight:800;
  box-shadow:0 3px 10px rgba(0,0,0,.35)
}
.pin.start{background:#2f8f5b}
.pin.end{background:#10263a}
.pin.done{background:#7e8d97}

.street-dot{
  width:10px;height:10px;border-radius:50%;
  background:#ffd33d;border:2px solid #10263a;
}

@media(max-width:600px){
  .metric{display:none}
}
@media(min-width:700px){
  .bottom{width:470px;right:auto}
  .top{max-width:760px}
}
</style>
</head>

<body>
<div id="map"></div>

<div class="top">
  <div class="card title-card">
    <div class="title">Rota • Grupo Reunidas</div>
    <div class="sub" id="status">Carregando rota fixa…</div>
  </div>
  <div class="card metric"><b id="km">—</b><span>distância</span></div>
  <div class="card metric"><b id="tempo">—</b><span>estimativa</span></div>
</div>

<div class="tools">
  <button class="fab" id="zin" aria-label="Aumentar zoom">+</button>
  <button class="fab" id="zout" aria-label="Diminuir zoom">−</button>
  <button class="fab" id="center" aria-label="Centralizar">⌖</button>
  <button class="fab" id="fit" aria-label="Ver rota inteira">⤢</button>
</div>

<div class="bottom">
  <div class="mode">
    <button id="modeIda" class="active">IDA → Reunidas</button>
    <button id="modeVolta">VOLTA → Casas</button>
  </div>

  <div class="route-seq" id="routeSeq"></div>

  <div class="eyebrow" id="nextLabel">PRÓXIMO EMBARQUE</div>
  <div class="next" id="nextName">Calculando…</div>
  <div class="nextmeta" id="nextMeta">Aguarde.</div>

  <div class="actions">
    <button class="btn primary" id="gps">Ativar GPS</button>
    <button class="btn" id="recalc">Recalcular</button>
    <button class="btn" id="maps">Google Maps</button>
    <button class="btn green" id="served">Embarcou</button>
  </div>

  <div class="progress">
    <span id="progressText">0 de 8 concluídos</span>
    <span id="modeText">Modo: ida</span>
  </div>

  <div class="gps-note" id="gpsNote">
    Trecho David → Natan: Av. Presidente Vargas → Rua Amazonas → Rua Rio Grande do Sul → Rua Rio Branco.
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DRIVER = {
  id:"motorista",name:"Motorista",
  lat:-17.997716,lon:-49.363442
};

const OFFICE = {
  id:"reunidas",name:"Grupo Reunidas",
  lat:-17.964560,lon:-50.008964
};

const P = {
  david:{
    id:"david",name:"David",
    lat:-18.0114722222,lon:-49.3354722222
  },
  natan:{
    id:"natan",name:"Natan",
    lat:-18.0340000000,lon:-49.3700833333
  },
  paulo:{
    id:"paulo",name:"Paulo",
    lat:-18.036596,lon:-49.374805
  },
  telcio:{
    id:"telcio",name:"Télcio",
    lat:-18.015975,lon:-49.372719
  },
  igor:{
    id:"igor",name:"Igor",
    lat:-18.0093055556,lon:-49.3623333333
  },
  patricia:{
    id:"patricia",name:"Patrícia",
    lat:-18.0018333333,lon:-49.3636666667
  },
  andreia:{
    id:"andreia",name:"Andreia",
    lat:-17.99549403666936,lon:-49.36505424068929
  },
  bandeirantes:{
    id:"bandeirantes",name:"Faz. Bandeirantes",
    lat:-17.998239,lon:-49.526376
  }
};

/*
  SEQUÊNCIA FIXA DEFINIDA:
  David > Natan > Paulo > Télcio > Igor > Patrícia > Andreia
  > Faz. Bandeirantes > Grupo Reunidas
*/
const IDA_ORDER = [
  P.david,
  P.natan,
  P.paulo,
  P.telcio,
  P.igor,
  P.patricia,
  P.andreia,
  P.bandeirantes
];

const VOLTA_ORDER = [...IDA_ORDER].reverse();

/*
  Pontos de passagem do trecho David -> Natan.
  Eles NÃO contam como passageiros e NÃO recebem numeração.
  Servem apenas para forçar o desenho da rota pelas vias indicadas.

  1. Av. Presidente Vargas / região da Rua Amazonas
  2. Rua Amazonas
  3. Rua Rio Grande do Sul
  4. Rua Rio Branco
*/
const STREET_VIA = [
  {
    id:"vargas",
    name:"Av. Presidente Vargas",
    lat:-18.01299,lon:-49.36252
  },
  {
    id:"amazonas",
    name:"Rua Amazonas",
    lat:-18.01520,lon:-49.36320
  },
  {
    id:"riograndedosul",
    name:"Rua Rio Grande do Sul",
    lat:-18.02009,lon:-49.37273
  },
  {
    id:"riobranco",
    name:"Rua Rio Branco",
    lat:-18.029535,lon:-49.369464
  }
];

let mode = localStorage.getItem("reunidas_mode_v2") || "ida";
let idaDone = new Set(JSON.parse(localStorage.getItem("reunidas_ida_done_v2") || "[]"));
let voltaDone = new Set(JSON.parse(localStorage.getItem("reunidas_volta_done_v2") || "[]"));

let currentPosition = null;
let routeLine = null;
let routeOutline = null;
let driverMarker = null;
let accuracyCircle = null;
let passengerMarkers = [];
let endpointMarkers = [];
let streetMarkers = [];
let watchId = null;
let routeDistance = null;
let routeDuration = null;
let routing = false;

const $ = id => document.getElementById(id);

const map = L.map("map",{
  zoomControl:false,
  attributionControl:true,
  touchZoom:true,
  dragging:true,
  doubleClickZoom:true,
  scrollWheelZoom:true,
  zoomAnimation:false,
  fadeAnimation:false,
  markerZoomAnimation:false
}).setView([-18.01,-49.46],11);

/* Google Híbrido */
const googleHybrid = L.tileLayer(
  "https://mt1.google.com/vt/lyrs=y&hl=pt-BR&x={x}&y={y}&z={z}",
  {
    minZoom:2,maxZoom:21,tileSize:256,zoomOffset:0,
    detectRetina:false,updateWhenIdle:true,
    updateWhenZooming:false,keepBuffer:5,
    attribution:"Google"
  }
).addTo(map);

function activeOrder(){
  return mode==="ida" ? IDA_ORDER : VOLTA_ORDER;
}

function activeDone(){
  return mode==="ida" ? idaDone : voltaDone;
}

function remaining(){
  const done=activeDone();
  return activeOrder().filter(p=>!done.has(p.id));
}

function tripStart(){
  if(currentPosition) return currentPosition;
  return mode==="ida" ? DRIVER : OFFICE;
}

function tripEnd(){
  return mode==="ida" ? OFFICE : DRIVER;
}

function saveState(){
  localStorage.setItem("reunidas_mode_v2",mode);
  localStorage.setItem("reunidas_ida_done_v2",JSON.stringify([...idaDone]));
  localStorage.setItem("reunidas_volta_done_v2",JSON.stringify([...voltaDone]));
}

function fmtKm(m){
  if(m==null) return "—";
  return m<1000 ? Math.round(m)+" m" : (m/1000).toFixed(1)+" km";
}

function fmtTime(s){
  if(s==null) return "—";
  const min=Math.max(1,Math.round(s/60));
  if(min<60) return min+" min";
  return Math.floor(min/60)+"h "+(min%60)+"min";
}

function pinIcon(label,cls=""){
  return L.divIcon({
    className:"",
    html:`<div class="pin ${cls}">${label}</div>`,
    iconSize:[32,32],iconAnchor:[16,16]
  });
}

function streetIcon(){
  return L.divIcon({
    className:"",
    html:'<div class="street-dot"></div>',
    iconSize:[14,14],iconAnchor:[7,7]
  });
}

function clearMarkers(){
  passengerMarkers.forEach(m=>map.removeLayer(m));
  endpointMarkers.forEach(m=>map.removeLayer(m));
  streetMarkers.forEach(m=>map.removeLayer(m));
  passengerMarkers=[];
  endpointMarkers=[];
  streetMarkers=[];
}

function rebuildMarkers(){
  clearMarkers();

  const start=mode==="ida" ? DRIVER : OFFICE;
  const end=mode==="ida" ? OFFICE : DRIVER;

  endpointMarkers.push(
    L.marker([start.lat,start.lon],{icon:pinIcon("S","start")})
      .addTo(map)
      .bindPopup(`<b>Início</b><br>${start.name}`)
  );

  endpointMarkers.push(
    L.marker([end.lat,end.lon],{icon:pinIcon("F","end")})
      .addTo(map)
      .bindPopup(`<b>Final</b><br>${end.name}`)
  );

  const done=activeDone();
  const order=activeOrder();

  order.forEach((p,i)=>{
    passengerMarkers.push(
      L.marker(
        [p.lat,p.lon],
        {icon:pinIcon(done.has(p.id)?"✓":String(i+1),done.has(p.id)?"done":"")}
      )
      .addTo(map)
      .bindPopup(
        `<b>${i+1}. ${p.name}</b><br>`+
        (done.has(p.id)
          ? (mode==="ida"?"Embarque concluído":"Desembarque concluído")
          : (mode==="ida"?"Embarque":"Desembarque"))
      )
    );
  });

  /*
    Mostra discretamente os pontos do caminho especial entre David/Natan
    para facilitar conferência no mapa.
  */
  STREET_VIA.forEach(v=>{
    streetMarkers.push(
      L.marker([v.lat,v.lon],{
        icon:streetIcon(),
        interactive:true
      })
      .addTo(map)
      .bindTooltip(v.name,{direction:"right"})
    );
  });
}

function buildRoutePoints(){
  const rem=remaining();
  const start=tripStart();
  const end=tripEnd();

  if(rem.length===0) return [start,end];

  const pts=[start];

  if(mode==="ida"){
    rem.forEach((p,i)=>{
      pts.push(p);

      /*
        Só injeta a sequência de ruas quando David e Natan ainda fazem
        parte do trajeto e Natan vem imediatamente depois de David.
      */
      if(p.id==="david"){
        const next=rem[i+1];
        if(next && next.id==="natan"){
          STREET_VIA.forEach(v=>pts.push(v));
        }
      }
    });
  }else{
    rem.forEach((p,i)=>{
      pts.push(p);

      /*
        Na volta, o trecho equivalente é Natan -> David.
        Usa os mesmos pontos em ordem inversa.
      */
      if(p.id==="natan"){
        const next=rem[i+1];
        if(next && next.id==="david"){
          [...STREET_VIA].reverse().forEach(v=>pts.push(v));
        }
      }
    });
  }

  pts.push(end);
  return pts;
}

async function routeFixed(fit=true){
  if(routing) return;
  routing=true;
  $("recalc").disabled=true;

  const points=buildRoutePoints();
  const coords=points.map(p=>`${p.lon},${p.lat}`).join(";");

  $("status").textContent=
    mode==="ida"
    ? "IDA • rota fixa definida pelo motorista"
    : "VOLTA • ordem inversa da ida";

  try{
    const res=await fetch(
      `https://router.project-osrm.org/route/v1/driving/${coords}`+
      `?overview=full&geometries=geojson&steps=false`
    );
    const data=await res.json();

    if(data.code!=="Ok" || !data.routes?.length){
      throw new Error("Rota indisponível");
    }

    const r=data.routes[0];
    routeDistance=r.distance;
    routeDuration=r.duration;

    drawGeoJSON(r.geometry,fit);

  }catch(e){
    console.error(e);
    routeDistance=null;
    routeDuration=null;
    drawSimple(points,fit);
    $("status").textContent="Rota fixa aproximada • serviço de ruas indisponível";
  }

  routing=false;
  $("recalc").disabled=false;

  rebuildMarkers();
  render();
}

function clearRoute(){
  if(routeLine) map.removeLayer(routeLine);
  if(routeOutline) map.removeLayer(routeOutline);
}

function drawGeoJSON(geo,fit){
  clearRoute();

  const latlngs=geo.coordinates.map(c=>[c[1],c[0]]);

  routeOutline=L.polyline(latlngs,{
    weight:9,color:"#fff",opacity:.84,
    lineCap:"round",lineJoin:"round"
  }).addTo(map);

  routeLine=L.polyline(latlngs,{
    weight:5,
    color:mode==="ida"?"#1769aa":"#e56f00",
    opacity:1,
    lineCap:"round",lineJoin:"round"
  }).addTo(map);

  if(fit) fitRoute();
}

function drawSimple(points,fit){
  clearRoute();

  const latlngs=points.map(p=>[p.lat,p.lon]);

  routeOutline=L.polyline(latlngs,{
    weight:8,color:"#fff",opacity:.72
  }).addTo(map);

  routeLine=L.polyline(latlngs,{
    weight:4,
    color:mode==="ida"?"#1769aa":"#e56f00",
    dashArray:"8 8"
  }).addTo(map);

  if(fit) fitRoute();
}

function fitRoute(){
  if(routeLine && routeLine.getBounds().isValid()){
    map.fitBounds(routeLine.getBounds(),{
      paddingTopLeft:[20,105],
      paddingBottomRight:[20,220]
    });
  }
}

function render(){
  $("km").textContent=fmtKm(routeDistance);
  $("tempo").textContent=fmtTime(routeDuration);

  $("modeIda").classList.toggle("active",mode==="ida");
  $("modeVolta").classList.toggle("active",mode==="volta");

  $("modeText").textContent="Modo: "+mode;

  const order=activeOrder();
  const names=order.map((p,i)=>`${i+1}. ${p.name}`).join(" → ");

  $("routeSeq").innerHTML=
    `<b>${mode==="ida"?"Sequência da ida":"Sequência da volta"}:</b> `+names;

  $("nextLabel").textContent=
    mode==="ida"?"PRÓXIMO EMBARQUE":"PRÓXIMO DESEMBARQUE";

  $("served").textContent=
    mode==="ida"?"Embarcou":"Desembarcou";

  $("served").className=
    "btn "+(mode==="ida"?"green":"orange");

  const done=activeDone();
  $("progressText").textContent=
    `${done.size} de ${order.length} concluídos`;

  const rem=remaining();

  if(rem.length){
    const first=rem[0];
    const originalNumber=order.findIndex(p=>p.id===first.id)+1;

    $("nextName").textContent=
      `${originalNumber}. ${first.name}`;

    $("nextMeta").textContent=
      first.id==="natan" && mode==="ida"
      ? "Acesso definido via Pres. Vargas → Amazonas → Rio Grande do Sul → Rio Branco."
      : `Próxima parada da ${mode}.`;

    $("served").disabled=false;
  }else{
    $("nextName").textContent=
      mode==="ida"?"Grupo Reunidas":"Motorista";

    $("nextMeta").textContent=
      mode==="ida"
      ?"Todos os embarques concluídos."
      :"Todos os desembarques concluídos.";

    $("served").disabled=true;
  }
}

function activateGPS(){
  if(!window.isSecureContext ||
     location.protocol==="content:" ||
     location.protocol==="file:"){

    $("gpsNote").textContent=
      "GPS bloqueado: abra o mapa pelo endereço HTTPS do GitHub Pages.";
    $("gps").textContent="GPS requer HTTPS";
    return;
  }

  if(!navigator.geolocation){
    $("gpsNote").textContent="Geolocalização indisponível neste navegador.";
    return;
  }

  if(watchId!==null){
    navigator.geolocation.clearWatch(watchId);
  }

  $("gpsNote").textContent="Buscando localização…";

  watchId=navigator.geolocation.watchPosition(
    pos=>{
      currentPosition={
        lat:pos.coords.latitude,
        lon:pos.coords.longitude
      };

      const ll=[currentPosition.lat,currentPosition.lon];

      if(!driverMarker){
        driverMarker=L.marker(ll,{
          icon:L.divIcon({
            className:"",
            html:'<div class="driver-dot"></div>',
            iconSize:[28,28],
            iconAnchor:[14,14]
          }),
          zIndexOffset:3000
        })
        .addTo(map)
        .bindPopup("<b>Localização atual do motorista</b>");

        accuracyCircle=L.circle(ll,{
          radius:pos.coords.accuracy||15,
          weight:1,opacity:.4,fillOpacity:.08,
          color:"#1677ff"
        }).addTo(map);
      }else{
        driverMarker.setLatLng(ll);
        accuracyCircle
          .setLatLng(ll)
          .setRadius(pos.coords.accuracy||15);
      }

      $("gps").textContent="GPS ativo";
      $("gpsNote").textContent=
        `Localização ativa • precisão aproximada ${Math.round(pos.coords.accuracy)} m`;
    },
    err=>{
      let msg="Não foi possível acessar a localização.";
      if(err.code===1) msg="Permissão de localização negada no navegador.";
      if(err.code===2) msg="O celular não conseguiu determinar a posição.";
      if(err.code===3) msg="Tempo esgotado ao obter a localização.";
      $("gpsNote").textContent=msg;
    },
    {
      enableHighAccuracy:true,
      maximumAge:3000,
      timeout:15000
    }
  );
}

async function setMode(newMode){
  mode=newMode;
  saveState();

  currentPosition=null;

  if(driverMarker){
    map.removeLayer(driverMarker);
    driverMarker=null;
  }
  if(accuracyCircle){
    map.removeLayer(accuracyCircle);
    accuracyCircle=null;
  }

  rebuildMarkers();
  render();
  await routeFixed(true);
}

$("modeIda").onclick=()=>setMode("ida");
$("modeVolta").onclick=()=>setMode("volta");

$("zin").onclick=()=>map.zoomIn();
$("zout").onclick=()=>map.zoomOut();

$("center").onclick=()=>{
  if(currentPosition){
    map.setView([currentPosition.lat,currentPosition.lon],17);
  }else{
    const s=mode==="ida"?DRIVER:OFFICE;
    map.setView([s.lat,s.lon],16);
  }
};

$("fit").onclick=fitRoute;
$("gps").onclick=activateGPS;
$("recalc").onclick=()=>routeFixed(false);

$("served").onclick=async()=>{
  const rem=remaining();
  if(!rem.length) return;

  activeDone().add(rem[0].id);
  saveState();

  await routeFixed(false);
};

$("maps").onclick=()=>{
  /*
    Google Maps recebe a ordem FIXA dos passageiros.
    O desenho principal do HTML é que contém os pontos especiais das ruas.
  */
  const s=tripStart();
  const e=tripEnd();
  const mids=remaining();

  let url=
    `https://www.google.com/maps/dir/?api=1`+
    `&origin=${encodeURIComponent(s.lat+","+s.lon)}`+
    `&destination=${encodeURIComponent(e.lat+","+e.lon)}`+
    `&travelmode=driving`;

  if(mids.length){
    url+=`&waypoints=${encodeURIComponent(
      mids.map(p=>p.lat+","+p.lon).join("|")
    )}`;
  }

  window.open(url,"_blank");
};

/* Duplo clique no título reinicia o modo atual */
document.querySelector(".title-card").ondblclick=async()=>{
  if(confirm(
    mode==="ida"
    ?"Reiniciar todos os embarques da ida?"
    :"Reiniciar todos os desembarques da volta?"
  )){
    activeDone().clear();
    saveState();
    await routeFixed(true);
  }
};

function fixSize(){
  setTimeout(()=>{
    map.invalidateSize(false);
    try{googleHybrid.redraw()}catch(e){}
  },150);
}

window.addEventListener("load",()=>{
  fixSize();
  setTimeout(fixSize,700);
  setTimeout(fixSize,1500);
});

window.addEventListener("resize",fixSize);
window.addEventListener("orientationchange",()=>setTimeout(fixSize,400));

document.addEventListener("visibilitychange",()=>{
  if(!document.hidden) fixSize();
});

rebuildMarkers();
render();
routeFixed(true);
</script>
</body>
</html>
